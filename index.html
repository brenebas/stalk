    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      // Clear cache storage and unregister old service workers to ensure fresh code on every load
      if (typeof window !== 'undefined') {
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var name of names) caches.delete(name);
          });
        }
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var r of registrations) r.unregister();
          });
        }
      }
      // Compatibility guard for browser extensions attempting to assign window.fetch
      try {
        let _currentFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
        Object.defineProperty(window, 'fetch', {
          get: function () {
            return _currentFetch;
          },
          set: function (fn) {
            _currentFetch = fn;
          },
          configurable: true,
          enumerable: true,
        });
      } catch (err) {
        // Fallback silently if environment prevents redefining
      }

      // Suppress unhandled errors originating from external browser extensions
      window.addEventListener('error', function (event) {
        if (event && event.filename && event.filename.includes('chrome-extension://')) {
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
